[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brickbyte"
version = "0.1.0"
description = "Sync data from Airbyte sources to Databricks Unity Catalog with streaming architecture"
authors = [
    { name="Sri Tikkireddy", email="sri.tikkireddy@databricks.com" },
    { name="Peter Park", email="peter.park@databricks.com" },
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["databricks", "airbyte", "etl", "data-engineering", "unity-catalog", "delta-lake"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "virtualenv==20.29.3",
  "databricks-sdk==0.95.0",
  "databricks-sql-connector==4.2.5",
  "airbyte==0.38.0",
  "pyarrow==21.0.0",
  "pyyaml==6.0.3",
]

[project.urls]
Homepage = "https://github.com/park-peter/brickbyte"
Repository = "https://github.com/park-peter/brickbyte"
Issues = "https://github.com/park-peter/brickbyte/issues"

[project.license]
file = "LICENSE"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff==0.6.4",
]
progress = [
  "tqdm==4.67.3",
]
local-spark = [
  "delta-spark>=3.2.0",
  "pyspark>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  # isort
  "I",
  # bugbear rules
  "B",
  # remove unused imports
  "F401",
  # bare except statements
  "E722",
  # print statements
  "T201",
  "T203",
  # misuse of typing.TYPE_CHECKING
  "TCH004",
  # import rules
  "TID251",
  # undefined-local-with-import-star
  "F403",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires configured Databricks workspace"]
addopts = "--strict-markers"
